name: Build and package Windows app

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore RavKavKiosk.WinUI/RavKavKiosk.WinUI.csproj

      - name: Build Release with Visual Studio MSBuild
        shell: powershell
        run: |
          msbuild RavKavKiosk.WinUI/RavKavKiosk.WinUI.csproj /t:Build /m /v:minimal /p:Configuration=Release /p:Platform=x64 /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish self-contained x64
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/publish | Out-Null
          msbuild RavKavKiosk.WinUI/RavKavKiosk.WinUI.csproj /t:Publish /m /v:minimal /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:WindowsPackageType=None /p:WindowsAppSDKSelfContained=true /p:PublishSingleFile=false /p:PublishReadyToRun=false /p:PublishDir="$PWD/artifacts/publish/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.${{ github.run_number }}" }
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DAppVersion=$version" "installer\RavKavKiosk.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: RavKavKiosk-Windows-x64-Installer
          path: artifacts/installer/RavKavKiosk-Setup-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload portable publish folder
        uses: actions/upload-artifact@v4
        with:
          name: RavKavKiosk-Windows-x64-Portable
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/installer/RavKavKiosk-Setup-x64.exe
